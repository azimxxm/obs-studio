name: Mac Build (self-hosted, Apple Silicon)

# Runs on the owner's own Mac. It never runs for pull requests, so code from
# strangers can't reach this machine. Only manual runs and version tags.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: mac-self-hosted
  cancel-in-progress: false

jobs:
  build:
    name: Build and package (arm64)
    # Second safety net: only the repo owner can start this job
    if: github.repository == 'azimxxm/obs-studio' && github.actor == 'azimxxm'
    runs-on: [self-hosted, macOS, ARM64, obs-mac]
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      BUILD_CONFIG: RelWithDebInfo
      PKG_INSTALL_DIR: /Applications/OBS Dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # keep build_macos and .deps between runs so builds stay incremental
          clean: false

      - name: Configure
        run: cmake --preset macos -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF

      - name: Build
        run: cmake --build build_macos --config "$BUILD_CONFIG" -- -quiet

      - name: Package .pkg
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="dev-$(git rev-parse --short HEAD)"
          fi
          mkdir -p dist
          rm -f dist/*.pkg
          pkgbuild \
            --component "build_macos/frontend/${BUILD_CONFIG}/OBS.app" \
            --install-location "${PKG_INSTALL_DIR}" \
            --identifier "com.azimxxm.obs-studio.pkg" \
            --version "${version#v}" \
            "dist/obs-studio-${version}-macos-arm64.pkg"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-studio-macos-arm64
          path: dist/*.pkg
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.pkg \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Apple Silicon (arm64) build. The app is not signed with an Apple Developer ID: after installing, open it once with right click -> Open, or allow it in System Settings -> Privacy & Security."
